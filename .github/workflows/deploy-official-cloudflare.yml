name: Publicação oficial Cloudflare — manual

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite PUBLICAR para liberar o deploy oficial"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kukkiwon-official-production
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/main' && inputs.confirmacao == 'PUBLICAR'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exigir credenciais oficiais para Cloudflare e projeto dedicado
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          if [[ -z "$CF_ACCOUNT" || -z "$CF_TOKEN" || "$SUPABASE_PUBLISHABLE" != sb_publishable_* ]]; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN e SUPABASE_PUBLISHABLE_KEY em GitHub Actions secrets."
            exit 1
          fi
      - name: Dependências
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validar release
        run: |
          npm run content:check
          npm run check
          npm test
      - name: Compilar site oficial sem rascunhos públicos
        env:
          PUBLIC_CONTENT_REVIEW: "false"
          PUBLIC_SPRINT02_SCHEMA: "true"
          PUBLIC_SUPABASE_URL: https://acbostnsohltuaegfkwl.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/atlas/index.html
          test -f dist/escolas/index.html
          test -f dist/curriculos/index.html
          if grep -R -n 'PRÉVIA DE REVISÃO · 108 rascunhos' dist/*.html; then
            echo "::error::A produção não pode ser compilada com o banner editorial de prévia."
            exit 1
          fi
      - name: Publicar somente Worker oficial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy --config wrangler.jsonc --name kukkiwon-ptbr-tkd
      - name: Link da publicação
        shell: bash
        run: |
          echo "## Primeiro deploy oficial" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: kukkiwon-ptbr-tkd" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Publicação de fichas técnicas: nenhuma; dados não revisados permanecem protegidos pelo Supabase." >> "$GITHUB_STEP_SUMMARY"
