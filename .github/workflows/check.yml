name: Validacao (sem deploy)
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run content:check
      - run: npm run acervo:check
      - run: npm run sources:audit
      - run: npm run research:audit
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run preview:prepare
      - run: npx playwright install --with-deps chromium
      - name: Conferir isolamento do glossário no pacote público
        run: node tools/local-validation/glossary-public.mjs
      - run: npm run test:ui
      - name: Conferir laboratório somente no servidor local
        run: npm run test:research:ui
      - name: Exibir contexto de erro se falhar teste de interface
        if: failure()
        run: |
          find test-results -name error-context.md -print -exec sed -n '1,100p' {} \; || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
